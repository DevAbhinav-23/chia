# Single-machine (localhost) Chia cluster for exercising the SRAM/OpenRAM
# pipeline against a REAL OpenRAM compiler + sky130 PDK, plus OpenROAD/OpenSTA validation of the
# generated Liberty/LEF.
#
# Topology:
#   - head:   runs on the host (no docker) — just `ray start --head`. Needs SOME
#             env with ray + chia active (yours — not a hardcoded one); see
#             head_env_commands / CHIA_HEAD_ENV_SETUP below.
#   - worker: one `ghcr.io/ucb-bar/chia-openram` container on the same host
#             (chia runs containers with --net=host, so it reaches the head's
#             Ray at 127.0.0.1). The image ships OpenRAM, the sky130 PDK (/scratch/pdk)
#             and OpenROAD (which embeds the OpenSTA engine) for read_liberty/
#             read_lef. It advertises the "openram" resource that
#             run_openram / characterize_*_with_openram require.
#
# Prerequisites on the host:
#   - any conda/venv with ray (2.54.0) + chia, ACTIVATED before you run
#   - passwordless SSH to 127.0.0.1 (`ssh 127.0.0.1` must not prompt)
#   - `docker login ghcr.io` (the ucb-chia image may be private)
#
# Bring up / tear down (activate your env first; the wrapper passes it through):
#   ./chia/vlsi/sram_openram/cluster/openram_cluster.sh up
#   ./chia/vlsi/sram_openram/cluster/openram_cluster.sh down
#
# Then run the smoke driver (see openram_smoke_test.py in this directory).

cluster_name: chia-openram-local

provider:
    head_ip: 127.0.0.1

auth:
    ssh_user: ${USER}

available_node_types:
    # One openram worker container. `resources.openram` is the pool the
    # @ChiaFunction(resources={"openram": 1}) tasks schedule against; each
    # OpenRAM run is single-threaded but can take 1-6 GB, so size this to
    # RAM/8GB on bigger boxes. CHIA_OPENRAM_CACHE_DIR inside the container
    # (/scratch/openram_cache) is NOT persistent across container restarts
    # unless you add a bind mount under docker.run_options.
    openram:
        resources: {"openram": 2}
        num_workers: 1
        compatible_ips: [127.0.0.1]
        docker:
            image: "ghcr.io/ucb-bar/chia-openram:latest"
            container_name: "chia_openram"
            pull_before_run: true

# The head runs on the host via a fresh SSH shell that does NOT inherit your
# interactive env, so it must re-activate one with ray + chia. Rather than
# hardcode a path, we bake in whatever activation you pass via the
# CHIA_HEAD_ENV_SETUP env var (expanded at load time). The openram_cluster.sh
# wrapper sets this automatically from your currently-active venv/conda env;
# if you invoke chia directly, `export CHIA_HEAD_ENV_SETUP="<your activate cmd>"`
# first. head_env_commands run on both `up` and `down`.
head_env_commands:
    - "${CHIA_HEAD_ENV_SETUP}"

head_start_ray_commands:
    - ray stop
    - ulimit -c unlimited && ray start --head --port=6379 --include-dashboard=True --dashboard-agent-listen-port=0

# Inside the container ray + chia + OpenRAM (via CHIA_OPENRAM_PYTHON) + openroad are
# set up; the provisioner injects --resources={"openram":2} into this start command.
worker_start_ray_commands:
    - ray stop
    - ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0

file_mounts: {}
