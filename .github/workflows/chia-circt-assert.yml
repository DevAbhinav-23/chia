name: Build CIRCT Assertions-On Image

# dockerfiles/ChiaCirctAssertDockerfile, the assertions-on CIRCT image an
# assertion oracle runs against. It rebuilds CIRCT's whole oracle and
# reducer target set from source under -O3 -UNDEBUG -gline-tables-only with the
# slang front end on, so it is slow (tens of minutes) and rare: manual dispatch
# only, and on changes to the Dockerfile itself.
#
# Build only, no push: this workflow proves the Dockerfile still builds, that
# its pin check still fires, and that the built image passes the cheap
# acceptance checks below. Publishing the image is left to the maintainers.
#
# CIRCT_SHA and CIRCT_VER are not defaulted. They are chosen per run by the
# release-pinned-main selector: the newest first-parent `main` commit whose
# `llvm` gitlink equals some firtool-* tag's `llvm` gitlink. A pair that does
# not satisfy that is rejected by the Dockerfile's own pin check before ninja
# starts.

on:
  workflow_dispatch:
    inputs:
      circt_sha:
        description: "CIRCT source commit, full 40-character SHA"
        required: true
        type: string
      circt_ver:
        description: "firtool-* release tag whose llvm pin equals that commit's"
        required: true
        type: string
      tool_targets:
        description: "ninja targets to build"
        required: false
        default: "circt-opt firtool circt-translate arcilator circt-reduce circt-verilog"
        type: string
      slang:
        description: "CIRCT slang front end, ON or OFF (OFF drops circt-verilog)"
        required: false
        default: "ON"
        type: string
  pull_request:
    paths:
      - dockerfiles/ChiaCirctAssertDockerfile
      - .github/workflows/chia-circt-assert.yml
  push:
    paths:
      - dockerfiles/ChiaCirctAssertDockerfile
      - .github/workflows/chia-circt-assert.yml

env:
  IMAGE: chia-circt-assert

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A from-source CIRCT build under -gline-tables-only is ~2 GB of build
      # tree on top of a ~5 GB base image. GitHub-hosted runners come with
      # ~14 GB free, so evict the bundled languages first -- the same set the
      # other slow image workflows evict.
      - name: Show disk before cleanup
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /opt/microsoft /opt/google || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/local/share/powershell || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On a Dockerfile change there is no dispatch input to read, so resolve
      # the pair from CIRCT's own history: the
      # newest first-parent main commit whose llvm gitlink has a release.
      # IN_SHA / IN_VER come through the environment, never interpolated into
      # the script body: a `${{ }}` expansion inside `run:` is textual
      # substitution and would let a dispatch input inject shell.
      - name: Resolve CIRCT_SHA / CIRCT_VER
        id: pin
        env:
          IN_SHA: ${{ inputs.circt_sha }}
          IN_VER: ${{ inputs.circt_ver }}
        run: |
          set -euo pipefail
          if [ -n "${IN_SHA:-}" ]; then
            if [ ${#IN_SHA} -ne 40 ] || [ -n "$(printf %s "$IN_SHA" | tr -d '0-9a-f')" ]; then
              echo "circt_sha must be a full 40-character lowercase hex SHA" >&2; exit 1
            fi
            case "$IN_VER" in firtool-*) ;; *)
              echo "circt_ver must be a firtool-* tag" >&2; exit 1 ;; esac
            echo "sha=$IN_SHA" >> "$GITHUB_OUTPUT"
            echo "ver=$IN_VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --filter=blob:none --no-checkout https://github.com/llvm/circt.git circt-pin
          cd circt-pin
          declare -A pin_tag=()
          while read -r tag; do
            pin="$(git ls-tree "$tag" llvm | awk '{print $3}')"
            [ -n "$pin" ] && pin_tag["$pin"]="$tag"     # newest wins, sorted ascending
          done < <(git for-each-ref --format='%(refname:short)' --sort=creatordate 'refs/tags/firtool-*')
          while read -r sha; do
            pin="$(git ls-tree "$sha" llvm | awk '{print $3}')"
            if [ -n "${pin_tag[$pin]:-}" ]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "ver=${pin_tag[$pin]}" >> "$GITHUB_OUTPUT"
              echo "chose $sha against ${pin_tag[$pin]} (llvm $pin)"
              exit 0
            fi
          done < <(git log --first-parent --format=%H origin/main | head -200)
          echo "no first-parent commit in the last 200 has a released llvm pin" >&2
          exit 1

      - name: Build
        uses: docker/build-push-action@v6
        with:
          file: dockerfiles/ChiaCirctAssertDockerfile
          context: .
          # Build only; see the header.
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE }}:ci-${{ github.run_id }}
          build-args: |
            CIRCT_SHA=${{ steps.pin.outputs.sha }}
            CIRCT_VER=${{ steps.pin.outputs.ver }}
            TOOL_TARGETS=${{ inputs.tool_targets || 'circt-opt firtool circt-translate arcilator circt-reduce circt-verilog' }}
            SLANG=${{ inputs.slang || 'ON' }}
            BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The build succeeding is not the same statement as the image being
      # usable. These are the cheap half of the image's acceptance checks -- the half that
      # needs no registry and no run root.
      - name: Smoke the built image
        run: |
          set -euo pipefail
          IMG=${{ env.IMAGE }}:ci-${{ github.run_id }}
          docker run --rm "$IMG" bash -lc '
            set -euo pipefail
            git -C /workspace/circt rev-parse HEAD
            # The SDK strip survived.
            test ! -e /opt/circt-sdk/include/circt
            test ! -e /opt/circt-sdk/lib/cmake/circt
            # Assertions back, line tables present.
            grep -q -- "-UNDEBUG" /workspace/circt/build/CMakeCache.txt
            test "$(grep -c -- -DNDEBUG /workspace/circt/build/compile_commands.json)" = 0
            test "$(nm -u /workspace/circt/build/bin/circt-opt | grep -c __assert_fail)" != 0
            test "$(readelf -S /workspace/circt/build/bin/circt-opt | grep -c debug_line)" != 0
            # Every target runs its own --version.
            for t in $CIRCT_ASSERT_TOOL_TARGETS; do /workspace/circt/build/bin/$t --version >/dev/null; done
            # lit, Verilator, ssh and rsync present; lit discovers every test.
            lit --version && verilator --version && ssh -V && rsync --version | head -1
            grep mlir_src_root /workspace/circt/build/test/lit.site.cfg.py
            lit --no-progress-bar --show-tests /workspace/circt/build/test > /tmp/lit.txt
            ! grep -q "unable to parse config file" /tmp/lit.txt
            grep -c "Tools/circt-tblgen" /tmp/lit.txt
            python -c "import ray; print(ray.__version__)"
          '

      - name: Show runner resources
        run: |
          free -h
          df -h
          docker system df || true
